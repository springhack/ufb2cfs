[mcu bmcu]
serial: /dev/ttyUSB0

[output_pin bmcu_channel_low]
pin: bmcu:channel_low

[output_pin bmcu_channel_high]
pin: bmcu:channel_high

[output_pin bmcu_channel_mode]
pin: bmcu:channel_mode

[output_pin bmcu_channel_trigger]
pin: bmcu:channel_action_trigger_pin

[manual_stepper bmcu_channel_action]
dir_pin: bmcu:channel_action_dir_pin
step_pin: bmcu:channel_action_step_pin
endstop_pin: bmcu:channel_action_endstop_pin
rotation_distance: 1
microsteps: 1

[gcode_macro BMCU_ACTION_PREPARE]
gcode:
  {% set mode = params.MODE|default("")|lower %}
  {% set channel = params.CHANNEL|default(-1)|int %}
  {% if mode not in ["load", "unload"] %}
    {action_raise_error("BMCU_ACTION_PREPARE requires MODE=load or MODE=unload")}
  {% endif %}
  {% if channel < 0 or channel > 3 %}
    {action_raise_error("BMCU channel must be 0-3: two output pins cannot uniquely encode channel 4")}
  {% endif %}
  {% set low = channel % 2 %}
  {% set high = (channel // 2) % 2 %}
  SET_PIN PIN=bmcu_channel_low VALUE={low}
  SET_PIN PIN=bmcu_channel_high VALUE={high}
  {% if mode == "load" %}
    SET_PIN PIN=bmcu_channel_mode VALUE=0
  {% else %}
    SET_PIN PIN=bmcu_channel_mode VALUE=1
  {% endif %}

[gcode_macro BMCU_ACTION_TRIGGER]
gcode:
  SET_PIN PIN=bmcu_channel_trigger VALUE=0
  G4 P100
  SET_PIN PIN=bmcu_channel_trigger VALUE=1
  G4 P100
  SET_PIN PIN=bmcu_channel_trigger VALUE=0

[gcode_macro BMCU_ACTION_WAIT]
gcode:
  MANUAL_STEPPER STEPPER=bmcu_channel_action SET_POSITION=0
  MANUAL_STEPPER STEPPER=bmcu_channel_action MOVE=900 SPEED=10 STOP_ON_ENDSTOP=1

[gcode_macro BMCU_RUN]
gcode:
  {% set mode = params.MODE|default("")|lower %}
  {% set channel = params.CHANNEL|default(-1)|int %}
  BMCU_ACTION_PREPARE MODE={mode} CHANNEL={channel}
  BMCU_ACTION_TRIGGER
  BMCU_ACTION_WAIT

[gcode_macro BMCU_LOAD]
gcode:
  BMCU_RUN MODE=load CHANNEL={params.CHANNEL}

[gcode_macro BMCU_UNLOAD]
gcode:
  {% if params.CHANNEL is defined %}
    BMCU_RUN MODE=unload CHANNEL={params.CHANNEL}
  {% else %}
    BMCU_RUN MODE=unload CHANNEL=0
    BMCU_RUN MODE=unload CHANNEL=1
    BMCU_RUN MODE=unload CHANNEL=2
    BMCU_RUN MODE=unload CHANNEL=3
  {% endif %}

[gcode_macro BMCU_MATERIAL_STATE]
variable_current: -1
gcode:
  {action_respond_info("Current BMCU material: %d" % printer["gcode_macro BMCU_MATERIAL_STATE"].current|int)}

[gcode_macro BMCU_SET_CURRENT_MATERIAL]
gcode:
  {% set material = params.MATERIAL|default(-1)|int %}
  {% if material < -1 or material > 7 %}
    {action_raise_error("MATERIAL must be -1 or 0-7")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=BMCU_MATERIAL_STATE VARIABLE=current VALUE={material}
  {action_respond_info("BMCU current material set to %d" % material)}

[gcode_macro BMCU_SET_M8200_TNN]
gcode:
  {% set material = params.MATERIAL|default(-1)|int %}
  {% if material < 0 or material > 7 %}
    {action_raise_error("MATERIAL must be 0-7")}
  {% endif %}
  {% set addr = (material / 4 + 1)|int|string %}
  {% set num_map = ['A', 'B', 'C', 'D'] %}
  {% set num = (material % 4)|int %}
  {% set tnn = 'T' + addr + num_map[num] %}
  {action_respond_info("tnn: %s" % tnn)}
  SET_GCODE_VARIABLE MACRO=M8200 VARIABLE=tnn VALUE='"{tnn}"'

[gcode_macro BMCU_SELECT_MATERIAL]
gcode:
  {% set target = params.TARGET|default(-1)|int %}
  {% set current = printer["gcode_macro BMCU_MATERIAL_STATE"].current|int %}
  {% if target < 0 or target > 7 %}
    {action_raise_error("TARGET must be 0-7")}
  {% endif %}
  {% if current < -1 or current > 7 %}
    {action_raise_error("BMCU_MATERIAL_STATE.current must be -1 or 0-7")}
  {% endif %}
  {% if current == target %}
    {action_respond_info("T%d already selected" % target)}
  {% else %}
    {action_respond_info("Switch material T%d -> T%d" % (current, target))}
    {% if current >= 0 %}
      M8200 P S{target}
      M8200 C S0
      {% if current < 4 %}
        M8200 R I{current}
      {% else %}
        BMCU_UNLOAD CHANNEL={current - 4}
      {% endif %}
    {% endif %}
    {% if target < 4 %}
      M8200 L I{target}
      M8200 F
      M8200 O S{target}
    {% else %}
      BMCU_SET_M8200_TNN MATERIAL={target}
      BMCU_LOAD CHANNEL={target - 4}
      M8200 W
      M8200 F
      M8200 O S{target}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=BMCU_MATERIAL_STATE VARIABLE=current VALUE={target}
  {% endif %}

[gcode_macro T0]
rename_existing: T0.233
gcode:
  BMCU_SELECT_MATERIAL TARGET=0

[gcode_macro T1]
rename_existing: T1.233
gcode:
  BMCU_SELECT_MATERIAL TARGET=1

[gcode_macro T2]
rename_existing: T2.233
gcode:
  BMCU_SELECT_MATERIAL TARGET=2

[gcode_macro T3]
rename_existing: T3.233
gcode:
  BMCU_SELECT_MATERIAL TARGET=3

[gcode_macro T4]
rename_existing: T4.233
gcode:
  BMCU_SELECT_MATERIAL TARGET=4

[gcode_macro T5]
rename_existing: T5.233
gcode:
  BMCU_SELECT_MATERIAL TARGET=5

[gcode_macro T6]
rename_existing: T6.233
gcode:
  BMCU_SELECT_MATERIAL TARGET=6

[gcode_macro T7]
rename_existing: T7.233
gcode:
  BMCU_SELECT_MATERIAL TARGET=7
